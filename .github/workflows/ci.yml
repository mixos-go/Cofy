name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # The isolation guarantee in ADR 0001 cannot be verified without a real Postgres, so one runs
    # here and the integration suite asserts on it directly.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://platform:platform@localhost:5432/platform_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          # ADR 0006: unflagged TypeScript type stripping requires Node >= 22.18.
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Boundaries runs first and on its own. A violation here means the change crossed a runtime
      # or ownership line from AGENTS.md, which is a design problem rather than a type error.
      - name: Check architectural boundaries
        run: pnpm boundaries

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration
